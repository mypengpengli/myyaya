name: Android source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm exec tsc --noEmit
      - run: corepack pnpm run test:myyaya
      - run: corepack pnpm test
      - run: corepack pnpm run motion:safety-test && corepack pnpm run ble:lifecycle-test && corepack pnpm run vosk:emergency-stop-test && corepack pnpm run motion:cliff-test && corepack pnpm run realtime:pcm-types-test
